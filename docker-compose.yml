services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ticketsells}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketsells}
      POSTGRES_DB: ${POSTGRES_DB:-ticketsells}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ticketsells} -d ${POSTGRES_DB:-ticketsells}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://ticketsells:ticketsells@postgres:5432/ticketsells?schema=public}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      PORT: 3000
      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN}
      TMDB_BASE_URL: ${TMDB_BASE_URL:-https://api.themoviedb.org/3}
      TMDB_IMAGE_BASE: ${TMDB_IMAGE_BASE:-https://image.tmdb.org/t/p/w500}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
